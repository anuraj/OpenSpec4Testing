name: qa-testing
version: 1
description: QA automation workflow - proposal → specs → test-strategy → tasks (Playwright/Selenium, C#/.NET)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal outlining the test automation effort
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this test automation effort is needed.

      Sections:
      - **Why**: 1-2 sentences on the coverage gap or risk. What's untested or under-tested today? Why now (new feature, regression risk, manual test burden, flaky suite, etc.)?
      - **What Changes**: Bullet list of test automation changes. Be specific about new test suites, frameworks, page objects/screen objects, fixtures, or CI pipelines being added or modified. Mark suite-breaking changes (e.g., replacing a framework) with **BREAKING**.
      - **Application Under Test**: Name the app/feature/area being tested, its URLs/endpoints, and how to access a test environment (staging URL, local docker-compose, etc.).
      - **Capabilities**: Identify which test specs will be created or modified:
        - **New Capabilities**: Features or flows getting test coverage for the first time. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case (e.g., `checkout-flow` or `api/orders`) and follow the project's existing spec organization.
        - **Modified Capabilities**: Existing test-covered flows whose expected behavior/scenarios are changing. Only include if the acceptance criteria being tested changed (not just refactoring test code). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no scenario changes.
      - **Impact**: Affected test projects, CI pipelines, environments, test data, and dependencies (e.g., NuGet packages, browser drivers).

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Each capability listed here needs a corresponding
      spec file describing the scenarios to automate.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only for pure test-infra
      changes with no new/changed scenarios (e.g., upgrading a NuGet package,
      renaming a project, fixing flaky CI config).

      Keep it concise (1-2 pages). Focus on the "why" and "what to cover" -
      framework and implementation choices belong in test-strategy.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Test specifications describing scenarios to automate for each capability
    template: spec.md
    instruction: |
      Create specification files that define WHAT behavior must be verified for the feature under test.

      A spec here is an acceptance-criteria contract, not a test implementation plan.

      Good spec content:
      - Observable, user-facing or API-facing behavior that must hold true
      - Inputs, expected outputs, and error/edge conditions
      - Cross-cutting constraints relevant to testing (accessibility, performance thresholds, security checks, browser/device matrix)
      - Scenarios written so each one maps cleanly to one automated test case

      Avoid in specs:
      - Playwright/Selenium selectors, locators, or page object class names
      - C#/.NET project structure, test runner (NUnit/xUnit/MSTest) choice
      - Step-by-step automation code or Page Object Model implementation details
      - CI pipeline YAML or execution details (these belong in test-strategy.md or tasks.md)

      Quick test: if the automation framework or tooling could change without
      changing what needs to be verified, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `checkout-flow` or `api/orders`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any newly introduced path segment must be kebab-case. Follow the project's existing organization.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no scenario-level change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New scenarios/flows to cover
      - **MODIFIED Requirements**: Changed expected behavior - MUST include full updated content
      - **REMOVED Requirements**: Retired scenarios/flows - MUST include **Reason** and **Migration** (e.g., "covered by new checkout-v2 suite")

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by the behavior it verifies
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format - write it so it reads like a test case (Given the setup implied by WHEN, THEN is the assertion)
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what user/business flow this capability
      covers. Archive copies it into the main spec it creates; without it the new
      main spec is left with a `TBD ... Update Purpose after archive` placeholder
      to fill in by hand. Do NOT add `## Purpose` to a delta for an existing
      capability - that spec already has one and the delta's is ignored. To
      change an existing capability's Purpose - including a leftover `TBD`
      placeholder - edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new expected behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Verifies that a shopper can complete checkout with a saved payment method end to end.

      ## ADDED Requirements

      ### Requirement: User can complete checkout with a saved card
      The system SHALL allow a signed-in user with a saved payment method to complete checkout without re-entering card details.

      #### Scenario: Successful checkout with saved card
      - **WHEN** a signed-in user with a saved card submits the checkout form
      - **THEN** the order is created and a confirmation page is displayed

      #### Scenario: Checkout fails with expired card
      - **WHEN** the user's saved card is expired
      - **THEN** an error message is shown and no order is created

      ## REMOVED Requirements

      ### Requirement: Legacy single-step checkout
      **Reason**: Replaced by multi-step checkout-v2 flow
      **Migration**: Covered by checkout-flow-v2 capability
      ```

      Every scenario here should be automatable as exactly one Playwright/Selenium test case.
    requires:
      - proposal

  - id: test-strategy
    generates: test-strategy.md
    description: Test automation strategy - framework, tooling, and technical approach
    template: test-strategy.md
    instruction: |
      Create the test strategy document that explains HOW the test scenarios will be automated.

      When to include test-strategy.md (create only if any apply):
      - New test project/suite or new framework/tooling introduced
      - Cross-cutting changes (shared fixtures, page objects, test data, CI pipeline)
      - New environment, browser/device matrix, or execution mode (parallel, headless, cross-browser)
      - Ambiguity that benefits from technical decisions before writing tests

      Sections:
      - **Context**: Current test coverage/tooling and constraints shaping the approach. Reference proposal.md for motivation instead of restating it.
      - **Goals / Non-Goals**: What this test effort achieves and explicitly excludes (e.g., "Non-Goal: performance/load testing").
      - **Framework & Tooling**: Playwright vs Selenium choice (and why), C#/.NET test runner (NUnit/xUnit/MSTest), assertion library, browser/driver management (Playwright's own drivers vs Selenium WebDriver/Selenium Grid), target browsers.
      - **Test Architecture**: Project structure, Page Object Model / Screen Object pattern, base test/fixture classes, dependency injection, parallelization strategy.
      - **Test Data Strategy**: How test data is seeded/cleaned (API setup, DB seeding, fixtures), isolation between test runs, use of test/staging environment vs mocks.
      - **CI/CD Integration**: Where tests run (pipeline stage), triggers, reporting (e.g., TRX/HTML reports, Allure), retry/flake handling, required gates before merge/deploy.
      - **Risks / Trade-offs**: Known limitations (e.g., flaky selectors, environment instability). Format: [Risk] → Mitigation.
      - **Open Questions**: Unknowns that can safely be answered later without changing specs or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the automation approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on the automation architecture and approach, not line-by-line test code.
      The proposal covers why and what to cover; specs cover expected behavior;
      test-strategy covers how it gets automated and run in CI.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist for building and running the automated tests
    template: tasks.md
    instruction: |
      Create the task list that breaks down the test automation work.

      Before writing tasks, check test-strategy.md for Open Questions. If any of
      them would change what gets built, resolve them with the user first - do
      not bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings (e.g., Project Setup, Page Objects/Fixtures, Test Cases, CI Integration)
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (project/framework setup before page objects, page objects before test cases, tests before CI wiring)
      - Each task MUST state how to verify completion (a passing test run, `dotnet test` command, CI pipeline green, or a reviewable artifact like a generated report). Use a separate verification task only when it checks a broader suite run spanning multiple test cases.

      Example:
      ```
      ## 1. Project Setup

      - [ ] 1.1 Create/extend the C#/.NET test project (e.g., `dotnet new nunit`) and verify `dotnet build` succeeds
      - [ ] 1.2 Add Playwright/Selenium NuGet packages and install browsers/drivers, verify a smoke test launches a browser

      ## 2. Page Objects / Fixtures

      - [ ] 2.1 Implement the CheckoutPage page object with locators for the checkout flow and verify it compiles and is used by a placeholder test
      - [ ] 2.2 Add shared test fixture for authenticated user setup/teardown and verify it runs in a sample test

      ## 3. Test Cases

      - [ ] 3.1 Automate "Successful checkout with saved card" scenario from checkout-flow spec and verify `dotnet test` passes locally
      - [ ] 3.2 Automate "Checkout fails with expired card" scenario and verify it fails correctly on unpatched code, then passes

      ## 4. CI Integration

      - [ ] 4.1 Add test project to CI pipeline stage and verify a pipeline run executes the new suite
      - [ ] 4.2 Configure test result reporting (TRX/HTML) and verify the report is published as a build artifact
      ```

      Reference specs for what scenarios need automated coverage, test-strategy for how to build it.
    requires:
      - specs
      - test-strategy

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Read context files (proposal, specs, test-strategy), work through pending
    tasks in tasks.md, mark complete as you go. Run `dotnet test` after
    implementing each test case to confirm it passes before checking it off.
    Pause if you hit blockers (missing test environment access, unclear
    selectors/locators, flaky tests) or need clarification.
